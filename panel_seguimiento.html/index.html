<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Seguimiento de Tareas</title>

    <!-- ENLACE CSS -->
    <link rel="stylesheet" href="estilopanel.css">
</head>

<body>

    <div class="contenedor">

        <h1>Panel de Seguimiento de Tareas</h1>

        <p class="descripcion">
            Herramienta para registrar y organizar tareas de un proyecto web.
        </p>

        <!-- FORMULARIO -->
        <form id="formularioTareas">

            <input type="text" id="tarea" placeholder="Nombre de la tarea">

            <input type="text" id="responsable" placeholder="Responsable">

            <select id="prioridad">
                <option value="">Seleccione prioridad</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>

            <!-- MEJORA -->
            <select id="estado">
                <option value="">Seleccione estado</option>
                <option value="Pendiente">Pendiente</option>
                <option value="En proceso">En proceso</option>
                <option value="Finalizada">Finalizada</option>
            </select>

            <!-- MEJORA -->
            <input type="date" id="fecha">

            <button type="submit">Agregar Tarea</button>

        </form>

        <!-- MENSAJES -->
        <div id="mensaje"></div>

        <!-- CONTADOR -->
        <h3>Total de tareas: <span id="contador">0</span></h3>

        <!-- TABLA -->
        <table>

            <thead>
                <tr>
                    <th>Tarea</th>
                    <th>Responsable</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                    <th>Fecha de entrega</th>
                </tr>
            </thead>

            <tbody id="listaTareas">

            </tbody>

        </table>

        <!-- BOTON LIMPIAR -->
        <button id="limpiar">Limpiar Tabla</button>

    </div>

    <!-- ENLACE JAVASCRIPT -->
    <script src="scriptpanel.js"></script>

</body>

</html>
